name: Customer Service CI/CD Workflow

on:
  push:
    branches:
      - main
      - feature/*
      - branchdev
      - releasebranch
      - hotfix
  pull_request:
    branches:
      - main
      - feature/*
      - branchdev
      - releasebranch
      - hotfix
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  setup-postgres:
    name: Set up PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Kittu@542
          POSTGRES_DB: customer_service_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Verify PostgreSQL Service Health
        run: docker exec postgres pg_isready -U postgres

  build-project:
    name: Build Project
    runs-on: ubuntu-latest
    needs: setup-postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Build with Maven
        run: mvn clean install

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Run Unit Tests
        run: mvn test

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Sonar Analysis
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=padmanabhamsaikeertana_customer-service-app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  coverage-report:
    name: Generate JaCoCo Coverage Report
    runs-on: ubuntu-latest
    needs: build-project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Coverage Report
        run: mvn verify

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml

  docker-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-project, run-tests, code-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: keertanapadmanabham/customer-service-image
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
